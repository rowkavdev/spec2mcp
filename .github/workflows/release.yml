name: Release

# Manual npm publish via trusted publishing (OIDC). The npm trusted
# publisher for this package matches on this filename (release.yml); the
# trusted-publishing token exchange replaces a long-lived npm token.
#
# Manual runs rehearse package creation by default. A maintainer must opt
# in to publishing and select a release tag matching package.json.

on:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the selected release tag to npm
        type: boolean
        default: false

permissions:
  id-token: write
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 26
          cache: npm
          registry-url: https://registry.npmjs.org
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build
      - run: npm test
      - name: Rehearse package creation
        if: ${{ !inputs.publish }}
        run: npm pack --dry-run --ignore-scripts

      - name: Verify the release tag
        if: ${{ inputs.publish }}
        run: |
          expected="v$(node -p 'require("./package.json").version')"
          if [[ "$GITHUB_REF_TYPE" != tag || "$GITHUB_REF_NAME" != "$expected" ]]; then
            echo "::error::Select release tag $expected before publishing."
            exit 1
          fi
      # Trusted publishing needs npm CLI 11.5.1 or later.
      - run: npm install -g npm@latest
        if: ${{ inputs.publish }}
      - run: npm publish --provenance --access public
        if: ${{ inputs.publish }}
