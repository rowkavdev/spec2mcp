openapi: 3.1.0
info:
  title: Nullable API
  version: 1.0.0
servers:
  - url: https://nullable.example.com
paths:
  /pets:
    get:
      operationId: getPet
      parameters:
        - name: verbose
          in: query
          schema:
            type: ["integer", "null"]
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                required: [id, tag]
                properties:
                  id:
                    type: string
                  tag:
                    type: ["string", "null"]
                  rating:
                    type: ["integer", "string", "null"]
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname:
                  type: ["string", "null"]
      responses:
        '201':
          description: Created
  /orders:
    post:
      operationId: createOrder
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - type: object
                  required: [nickname]
                  properties:
                    nickname:
                      type: ["string", "null"]
      responses:
        '201':
          description: Created
  /pets/{petId}:
    get:
      operationId: showPet
      parameters:
        - name: petId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK, or JSON null when the pet is gone
          content:
            application/json:
              schema:
                type: ["object", "null"]
                required: [id]
                properties:
                  id:
                    type: string
  /cats/{catId}:
    get:
      operationId: showCat
      parameters:
        - name: catId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK, or JSON null via oneOf
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                  - type: "null"
  /ghost:
    get:
      operationId: showGhost
      responses:
        '200':
          description: Always JSON null via const
          content:
            application/json:
              schema:
                const: null
  /birds/{birdId}:
    get:
      operationId: showBird
      parameters:
        - name: birdId
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: OK - object or, for flocks, an array
          content:
            application/json:
              schema:
                oneOf:
                  - type: object
                    required: [id]
                    properties:
                      id:
                        type: string
                  - type: array
                    items:
                      type: string
