openapi: 3.0.3
info:
  title: Union 3.0 API
  version: 1.0.0
servers:
  - url: https://union30.example.com
paths:
  /pets:
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [nickname]
              properties:
                nickname:
                  # Off-spec in 3.0.x (unions are a 3.1 form) but published
                  # specs carry it; must not be silently dropped (#88).
                  type: ["string", "null"]
      responses:
        '201':
          description: Created
