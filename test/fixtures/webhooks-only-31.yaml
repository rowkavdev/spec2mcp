# A valid 3.1 document with no paths at all - webhooks only.
openapi: 3.1.0
info:
  title: Events Only
  version: 0.1.0
webhooks:
  orderShipped:
    post:
      operationId: orderShipped
      summary: An order shipped
      responses:
        '202':
          description: Accepted
  orderCancelled:
    post:
      summary: An order was cancelled
      responses:
        '202':
          description: Accepted
  orderReturned:
    $ref: '#/components/pathItems/OrderReturnedHook'
components:
  pathItems:
    OrderReturnedHook:
      post:
        operationId: orderReturned
        summary: An order was returned
        responses:
          '202':
            description: Accepted
