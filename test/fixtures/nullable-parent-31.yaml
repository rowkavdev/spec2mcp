openapi: 3.1.0
info:
  title: Nullable Parent API
  version: 1.0.0
servers:
  - url: http://placeholder.invalid
paths:
  /pets:
    post:
      operationId: createPet
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [pet]
              properties:
                pet:
                  type: ["object", "null"]
                  properties:
                    id:
                      type: string
      responses:
        '201':
          description: Created
